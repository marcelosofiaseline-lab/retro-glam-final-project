<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Retro Glam</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/home" class="logo">Retro<span>Glam</span></a>
    <nav class="mainnav" id="mainNav">
      <ul>
        <li><a href="/home">Home</a></li>
        <li><a href="/shop">Shop</a></li>
        <li><a href="/features">Features</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>
    <div style="display:flex; align-items:center; gap:10px;">
      <a href="/register" class="nav-cta">Sign Up</a>
      <button class="nav-toggle" onclick="toggleNav()">&#9776;</button>
    </div>
  </div>
</header>

<section style="padding:80px 0; display:flex; justify-content:center;">
  <div class="form-card" style="max-width:420px; width:100%;">
    <h2 style="font-size:1.4rem; margin-bottom:22px; text-align:center;">Welcome back</h2>
    <form onsubmit="event.preventDefault(); window.location.href='/profile';">
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="hannah@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="submit-btn">Log In</button>
    </form>
    <p class="form-foot">New to Retro Glam? <a href="/register">Create an account</a></p>
  </div>
</section>

<script src="/js/main.js"></script>
</body>
</html>
